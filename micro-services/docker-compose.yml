version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ems-mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ems
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always

  ai-service:
    build: ./AiService
    container_name: ems-ai-service
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

volumes:
  mysql-data:

# USER SERVICE
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  ports:
    - port: 5002
  selector:
    app: user-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: MYSQL_HOST
              value: host.docker.internal

---
# EXPENSE SERVICE
